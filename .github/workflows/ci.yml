# Continuous integration.
#
# The job names below are an interface: the row that pins required status
# checks points at them by name, and renaming one after that silently removes
# a required check — the pull request shows no red, it just stops being gated.
#
# The pull-request trigger filters on `main` deliberately. A pull request
# opened against a branch that is itself not `main` matches no event and runs
# zero checks, and no runs at all reads as quiet rather than red.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The floor declared in the package manifest's engines field. Native
  # TypeScript type stripping is unflagged from this version, which is what
  # lets the sources run with no build step.
  NODE_FLOOR: '22.18'

jobs:
  # The public-repo hygiene gate, as its own job so a failure names the gate
  # rather than naming a job that runs five things.
  external-refs:
    name: external-refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
      # No install step, deliberately: the gate runs with no dependencies so a
      # tree with nothing installed can still be checked.
      - run: npm run check:external-refs

  arbitration:
    name: arbitration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
      # No install step, deliberately: these scans read the tree off disk, so a
      # checkout with nothing installed is exactly what they need.
      - run: npm run check:arbitration

  # The capture/diff sequencing rule (SCHEMA.md 7.3,
  # capture.no_diff_dependency), as its own job for the same reason the
  # hygiene gate is one: a failure should name the rule, not a job that runs
  # five things. No install step — the gate reads sources and needs nothing.
  capture-isolation:
    name: capture-isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
      - run: npm run check:capture-isolation

  # The build rule that keeps the bytes surface from accepting a caller's path
  # (SCHEMA.md 7.3, artifact.no_request_path).
  #
  # Its own job, for the same reason the three gates above have theirs: a
  # failure should name the rule rather than name a job that runs five things.
  # Like them it needs no dependencies — it reads source text — so there is no
  # install step and a tree with nothing installed can still be checked.
  artifact-path:
    name: artifact-path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
      - run: npm run check:artifact-path

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  # The test suite, on the lowest supported version and on the current one.
  # Running the floor is what makes the engines field a claim something checks.
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Install and run from a clean checkout.
  #
  # This is the release check for a service that has no image to build and no
  # runtime to deploy: it is spawned by its caller and exits with it, so
  # installation is the whole of deployment. A hosted runner is exactly the
  # clean case — nothing mapped, no store, nothing configured — so the job
  # installs the package the way a stranger would and then proves the
  # executable actually starts, steps its own schema, answers and exits.
  #
  # `npm ci --ignore-scripts` is deliberately NOT used: the single runtime
  # dependency compiles or downloads a native binding in its install script,
  # and skipping that would test an installation nobody performs.
  install:
    name: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: npm run check:install

  # Windows earns a job because the network-location refusal has a
  # platform-specific path that would otherwise never execute in continuous
  # integration at all. A hosted runner has nothing mapped, so this proves the
  # code path runs rather than exercising the mapped-drive case — which is
  # exactly why that case is driven through an injected resolver in the tests.
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

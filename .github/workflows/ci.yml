# Continuous integration.
#
# The job names below are an interface: the row that pins required status
# checks points at them by name, and renaming one after that silently removes
# a required check — the pull request shows no red, it just stops being gated.
#
# The pull-request trigger filters on `main` deliberately. A pull request
# opened against a branch that is itself not `main` matches no event and runs
# zero checks, and no runs at all reads as quiet rather than red.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The floor declared in the package manifest's engines field. Native
  # TypeScript type stripping is unflagged from this version, which is what
  # lets the sources run with no build step.
  NODE_FLOOR: '22.18'

jobs:
  # The public-repo hygiene gate, as its own job so a failure names the gate
  # rather than naming a job that runs five things.
  external-refs:
    name: external-refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
      # No install step, deliberately: the gate runs with no dependencies so a
      # tree with nothing installed can still be checked.
      - run: npm run check:external-refs

  # The dangling-documentation-link gate, as its own job for the same reason
  # the hygiene gate is one: a failure should name the rule that fired.
  doc-links:
    name: doc-links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
      # No install step, deliberately: the scan reads the tree off disk, so a
      # checkout with nothing installed is exactly what it needs.
      - run: npm run check:doc-links

  # The pinned-install-version gate: the `playwright-core` version documented
  # in README.md and docs/ROLLOUT.md must match the exact pin in
  # package.json, so a version bump that touches one and not the other fails
  # here instead of sending the next newcomer through the install-doctor-
  # remedy loop the pin/docs mismatch used to cause.
  pinned-install:
    name: pinned-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
      # No install step, deliberately: the gate reads package.json and the
      # docs off disk — it never resolves node_modules — so a checkout with
      # nothing installed is exactly what it needs.
      - run: npm run check:pinned-install

  arbitration:
    name: arbitration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
      # No install step, deliberately: these scans read the tree off disk, so a
      # checkout with nothing installed is exactly what they need.
      - run: npm run check:arbitration

  # The capture/diff sequencing rule (SCHEMA.md 7.3,
  # capture.no_diff_dependency), as its own job for the same reason the
  # hygiene gate is one: a failure should name the rule, not a job that runs
  # five things. No install step — the gate reads sources and needs nothing.
  capture-isolation:
    name: capture-isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
      - run: npm run check:capture-isolation

  # The build rule that keeps the bytes surface from accepting a caller's path
  # (SCHEMA.md 7.3, artifact.no_request_path).
  #
  # Its own job, for the same reason the three gates above have theirs: a
  # failure should name the rule rather than name a job that runs five things.
  # Like them it needs no dependencies — it reads source text — so there is no
  # install step and a tree with nothing installed can still be checked.
  artifact-path:
    name: artifact-path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
      - run: npm run check:artifact-path

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  # The test suite, on the lowest supported version and on the current one.
  # Running the floor is what makes the engines field a claim something checks.
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Install and run from a clean checkout.
  #
  # This is the release check for a service that has no image to build and no
  # runtime to deploy: it is spawned by its caller and exits with it, so
  # installation is the whole of deployment. A hosted runner is exactly the
  # clean case — nothing mapped, no store, nothing configured — so the job
  # installs the package the way a stranger would and then proves the
  # executable actually starts, steps its own schema, answers and exits.
  #
  # `npm ci --ignore-scripts` is deliberately NOT used: the single runtime
  # dependency compiles or downloads a native binding in its install script,
  # and skipping that would test an installation nobody performs.
  install:
    name: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: npm run check:install

  # Drive the shipped executables and assert they reach the service.
  #
  # This is its own job rather than a case in the suite because of what it
  # refuses to do: it injects nothing. Every test in the suite hands a service
  # to the dispatcher — correctly, since that injection is the seam that lets
  # the command line be driven in process at all — and so not one of them can
  # observe whether the binary builds one by itself. That is the claim a user
  # depends on, and it needs a job that spawns the executables the manifest
  # names and speaks to them over real pipes.
  operations:
    name: operations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: npm run check:operations

  # The argument-refusal check spawns the shipped executables against arguments
  # a caller gets wrong, and asserts each is refused with a rule name rather
  # than crashing or answering with the storage layer's own words.
  #
  # It earns its own job for the same reason `operations` does: it is the only
  # thing here that runs the binaries as a person runs them. The defect it was
  # written for — a missing argument reaching a column's CHECK, killing the
  # process with a driver error — passed every one of a thousand tests for
  # thirty pull requests, because every test supplied the argument.
  argument-refusals:
    name: argument-refusals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: npm run check:argument-refusals

  # The reachability gate: a declared argument is read by something.
  #
  # Its own job, and no install step — it reads source text rather than
  # importing modules, so it runs against a tree with nothing installed like
  # the hygiene gate above.
  #
  # The defect it was written for is the one that does not announce itself. A
  # missing argument is refused and the caller goes and reads something; an
  # inert one succeeds, so the caller draws a conclusion from it. `wait_ms` was
  # declared, documented and discarded, and a session varied it between two
  # captures and filed a high-severity finding against an application that did
  # not have the fault. Nothing was red at any point.
  argument-reachability:
    name: argument-reachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
      - run: npm run check:argument-reachability

  # The injected-test rule was prose in a test header until it went stale, so
  # it earns a job of its own rather than riding along inside another. A rule
  # that is only enforced when somebody remembers to run the aggregate script
  # is the same rule that drifted in the first place.
  injected-tests:
    name: injected-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: npm run check:injected-tests

  # The packaging check: prove the tarball a stranger installs actually runs.
  #
  # `install` above proves a *checkout* installs and spawns, which is the
  # development path and runs the sources under native type stripping. The
  # published artefact is a different thing — emitted JavaScript, unpacked
  # under `node_modules` — and the one property that differs is the one that
  # breaks: Node refuses to strip types under `node_modules`, so a manifest
  # whose `bin` names a `.ts` file passes every other job here, publishes,
  # installs, and then fails on the machine of whoever installed it.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: npm run check:package

  # Drive a REAL browser, and refuse a run in which the tests skipped.
  #
  # ── The hole this closes ───────────────────────────────────────────────
  #
  # Every suite that drives a real browser gates itself on a browser binary
  # AND a display, and a hosted runner had neither — so on the `test` job
  # above, all forty-seven of them skipped and the run was GREEN. Tests that
  # report a pass by not executing are the defect this repository keeps
  # finding, and here it was load-bearing: the `isConnected` delegation
  # shipped absent, every real call took the assume-usable branch, and
  # sixteen hosted jobs stayed green because the only tests that could see it
  # never ran.
  #
  # ── Headed, via a real X server. NEVER headless ────────────────────────
  #
  # `xvfb-run` supplies a genuine display, so the browser runs HEADED — which
  # is the whole point. `tests/browser/keeper-tab.test.ts` measures behaviour
  # that DOES NOT OCCUR headless (headed, a browser dies when its last tab
  # closes; headless, it survives), and its header states that headless is
  # "exactly the mode in which it cannot fail". Making these pass by running
  # them headless would rebuild the fake green this job exists to delete.
  #
  # ── Why a subset, and why that is stated out loud ──────────────────────
  #
  # `tests/browser/cross-process-act.test.ts` is NOT in this gate. It is
  # flaky — measured at about one failure in four runs in isolation on an
  # idle machine, a `connectOverCDP` timeout where the websocket connects and
  # the handshake never completes. A flaky required gate gets ignored and
  # then disabled, which is worse than no gate. The exclusion is named in
  # `scripts/check-browser-tests.mjs` rather than left as an absence nobody
  # can see.
  #
  # ── Not a required check on day one ────────────────────────────────────
  #
  # `continue-on-error` is set deliberately for the first soak: a browser job
  # on a hosted runner has no track record here, and the honest way to earn a
  # required check is to watch it be green on its own for a while first. It
  # still reports, and its failures are still visible. REMOVE THIS ONCE THE
  # JOB HAS PROVED STEADY, and add it to the required set — a permanently
  # advisory gate is a gate nobody has to obey.
  browser-tests:
    name: browser-tests
    runs-on: ubuntu-latest
    # The mutation this job was proved with fails on an assertion only after
    # a connection timeout elapses, so the budget is well clear of the ~1
    # minute a healthy run takes: a timeout-killed job would be red for the
    # wrong reason and would prove nothing.
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      # The install command is the one the README and docs/ROLLOUT.md
      # document, character for character and INCLUDING THE VERSION, so that
      # `check:pinned-install` polices this file too — it scans this workflow
      # by name. Dropping the `-p playwright-core@<version>` prefix here would
      # let npx resolve latest and fetch a Chromium the pinned library was
      # never tested against, which is the install-loop defect that shipped in
      # 0.4.1. That gate now refuses this file if the version goes missing or
      # drifts — including inside a comment, as this comment found out.
      #
      # `--with-deps` installs the shared libraries a Chromium needs on a bare
      # Ubuntu image; without them the binary is present and fails to start,
      # which would read as a test failure rather than as a missing library.
      - name: Install the pinned browser
        run: npx -p playwright-core@1.62.1 playwright-core install --with-deps chromium
      # `xvfb-run` is what makes the browser headed. The check itself asserts
      # the run was real: nothing skipped, nothing failed, and at least the
      # expected number of tests actually passed.
      - name: Diagnose whether the sandbox is what kills the browser
        run: |
          BIN=$(node -e "console.log(require('playwright-core').chromium.executablePath())")
          echo "binary: $BIN"
          DIR=$(mktemp -d)
          echo "=== WITH sandbox (exactly what launch.ts does today) ==="
          timeout 25 xvfb-run --auto-servernum "$BIN" --user-data-dir="$DIR/a" --remote-debugging-port=0 --no-first-run --no-default-browser-check about:blank > "$DIR/with.log" 2>&1
          echo "exit=$?"
          tail -25 "$DIR/with.log"
          echo "=== WITHOUT sandbox ==="
          timeout 25 xvfb-run --auto-servernum "$BIN" --user-data-dir="$DIR/b" --no-sandbox --remote-debugging-port=0 --no-first-run --no-default-browser-check about:blank > "$DIR/without.log" 2>&1
          echo "exit=$?"
          tail -25 "$DIR/without.log"
          echo "=== DevToolsActivePort written? ==="
          cat "$DIR/a/DevToolsActivePort" 2>&1 || echo "WITH sandbox: NO endpoint file"
          cat "$DIR/b/DevToolsActivePort" 2>&1 || echo "WITHOUT sandbox: NO endpoint file"
      - name: Run the real-browser suites
        run: xvfb-run --auto-servernum npm run check:browser-tests

  # Windows earns a job because the network-location refusal has a
  # platform-specific path that would otherwise never execute in continuous
  # integration at all. A hosted runner has nothing mapped, so this proves the
  # code path runs rather than exercising the mapped-drive case — which is
  # exactly why that case is driven through an injected resolver in the tests.
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
